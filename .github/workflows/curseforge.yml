name: Publish Forever beta to CurseForge

on:
  push:
    tags:
      - "*-forever.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and build
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.1
          lua5.1 tests/profession_info.lua
          lua5.1 tests/ui_smoke.lua
          python3 tools/package.py
      - name: Locate package
        id: package
        run: echo "path=$(find dist -name 'FishMaster-*.zip' -print -quit)" >> "$GITHUB_OUTPUT"
      - name: Publish
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          project_id: "398695"
          game_endpoint: "wow"
          file_path: ${{ steps.package.outputs.path }}
          display_name: ${{ github.ref_name }}
          game_versions: "1.60.1"
          release_type: beta
