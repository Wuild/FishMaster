name: Forever checks

on:
  push:
    branches: [forever]
  pull_request:
    branches: [forever]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: find scripts locales tests -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
      - run: lua5.1 tests/profession_info.lua
      - run: lua5.1 tests/ui_smoke.lua
      - run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: FishMaster-Forever
          path: dist/*.zip
